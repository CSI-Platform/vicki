  <!-- Footer: Wi-Fi -->
  <rect x="60" y="985" width="680" height="150" rx="10" fill="#fff4e5" stroke="#f29900" stroke-width="2"/>
  <text x="80" y="1015" class="footer-title">Wi-Fi: the adapter is fine; 6 GHz is enabled</text>
  <text x="80" y="1043" class="b">• iw reg get = country US → 6 GHz channels enabled.</text>
  <text x="80" y="1068" class="b">• No 6E SSID is visible yet. The adapter needs SSID + password.</text>
  <text x="80" y="1093" class="b">• Both antennas must be connected for 2x2. One antenna = 1x1.</text>
  <text x="80" y="1118" class="b">• Keep it on USB 3. It failed on USB 2 (patch semaphore).</text>

  <!-- Footer: Bluetooth -->
  <rect x="760" y="985" width="680" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="780" y="1015" class="footer-title">Bluetooth: Jabra is visible but not paired</text>
  <text x="780" y="1043" class="b">• It advertises as LE-Jabra Evolve3 85 (random LE address).</text>
  <text x="780" y="1068" class="b">• Pairing mode: hold the On/Off switch until the LED flashes blue.</text>
  <text x="780" y="1093" class="b">• Previous attempt reached Connected: yes, then AuthenticationFailed.</text>
  <text x="780" y="1118" class="b">• Audio needs a successful pair and connect; PipeWire is running.</text>

